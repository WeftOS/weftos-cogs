[package]
name = "cog-tof-scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Companion app for the sen0628-tof cog (DFRobot SEN0628 8x8 matrix ToF): live zone heatmap, hook-up checklist, levelling and noise calibration, guide (native + wasm)"

[lib]
name = "cog_tof_scope"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "weft-tof-scope"
path = "src/main.rs"

[dependencies]
egui_plot = "0.35"
serde_json = { workspace = true }
web-time = "1.1"
cog-companion = { path = "../cog-companion" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
