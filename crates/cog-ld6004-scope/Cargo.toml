[package]
name = "cog-ld6004-scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Companion bench console for the ld6004-radar cog (HLK-LD6004 60 GHz presence radar) on a local UART (native only)"

[[bin]]
name = "weft-ld6004-scope"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.35"
serialport = "4"
