name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build all cogs (armv7 + aarch64)
        run: scripts/cross-build.sh
      - name: Collect artifacts
        run: |
          set -euo pipefail
          rm -rf dist
          fail=0
          for toml in src/cogs/*/cog.toml; do
            id="$(basename "$(dirname "$toml")")"
            srcdir=".cargo-target/dist/$id"
            mkdir -p "dist/$id"
            for f in manifest.json "cog-$id-arm" "cog-$id-arm64"; do
              if [ ! -s "$srcdir/$f" ]; then
                echo "collect: missing $srcdir/$f" >&2
                fail=1
                continue
              fi
              cp "$srcdir/$f" "dist/$id/$f"
            done
            if [ -s "$srcdir/cog-$id-x86_64" ]; then
              cp "$srcdir/cog-$id-x86_64" "dist/$id/"
            fi
          done
          [ "$fail" -eq 0 ]
          find dist -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: cog-binaries
          path: dist/
          if-no-files-found: error

  # Signing is a separate controlled step (COG-012 Q1). This public workflow
  # does not have WEAVELOGIC_RELEASE_KEY. A controlled host runs
  # scripts/release-gate.sh --key <pem>, which signs dist/, verifies, and
  # checks that registry.json has every cog at arm and arm64 (and x86_64
  # when that binary was built). The uploaded tree is
  # <id>/{manifest.json,cog-<id>-arm,cog-<id>-arm64}. registry.json records
  # each binary signature. That file itself is not signed.
