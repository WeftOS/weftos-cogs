[workspace]
resolver = "2"
exclude = ["src/cogs/*"]
members = [
    "crates/cog-sensor-sources",
    "crates/cog-companion",
    "crates/cog-host",
    "crates/cog-manager",
    "crates/cog-market",
    "crates/cog-protocol",
    "crates/cog-repo",
    "crates/cog-sources",
    "crates/cog-ecg-scope",
    "crates/guide-view",
    "crates/sensor-guide",
    "crates/cog-sound-scope",
    "crates/cog-tof-scope",
]

[workspace.package]
version = "0.8.3"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/weave-logic-ai/weftos-cogs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
