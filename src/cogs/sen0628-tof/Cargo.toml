[workspace]

[package]
name = "cog-sen0628-tof"
version = "0.1.0"
edition = "2021"
description = "DFRobot SEN0628 8x8 matrix ToF (VL53L7CX + RP2040) over I2C: depth frames, nearest object, presence, motion and sector distances, fail-honest"

[[bin]]
name = "cog-sen0628-tof"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

# Off by default: the default build has the same code and dependencies without it.
# `spatial-evidence` adds the spatial.evidence.v1 adapter (src/spatial.rs, ADR-159).
[features]
spatial-evidence = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
