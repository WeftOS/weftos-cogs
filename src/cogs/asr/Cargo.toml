[workspace]

[package]
name = "cog-asr"
version = "0.1.0"
edition = "2021"
description = "Segments the microphone stream into utterances and publishes their transcripts"
publish = false

[[bin]]
name = "cog-asr"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
