[workspace]

[package]
name = "cog-board-telemetry"
version = "0.1.0"
edition = "2021"
description = "Board health from Linux sysfs: INA2xx power, fan RPM, thermal zones by group, load and free memory; fail-honest on no source"
publish = false

[[bin]]
name = "cog-board-telemetry"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
