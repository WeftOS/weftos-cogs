[workspace]

[package]
name = "cog-can-anomaly"
version = "0.1.0"
edition = "2021"
description = "Learns a CAN bus and reports ids and rates that depart from it"
publish = false

[[bin]]
name = "cog-can-anomaly"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
