[workspace]

[package]
name = "cog-can-fd"
version = "0.1.0"
edition = "2021"
description = "Receives a SocketCAN interface and publishes its frames as can.frame.v1 records"
publish = false

[[bin]]
name = "cog-can-fd"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
