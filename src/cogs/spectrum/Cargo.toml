[workspace]

[package]
name = "cog-spectrum"
version = "0.1.0"
edition = "2021"
description = "Spectrum consumer: reads the Pluto owner cog's IQ stream and publishes spectrum.psd.v1 readings and band occupancy with the lost samples counted"
publish = false

[[bin]]
name = "cog-spectrum"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
