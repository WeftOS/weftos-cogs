[workspace]

[package]
name = "cog-audio-out"
version = "0.1.0"
edition = "2021"
description = "Owns the ALSA playback device and plays the 16 kHz mono PCM stream it is sent"
publish = false

[[bin]]
name = "cog-audio-out"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
