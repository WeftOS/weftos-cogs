[workspace]

[package]
name = "cog-sdr-pluto-rx"
version = "0.1.0"
edition = "2021"
description = "PlutoSDR owner cog: opens the radio through libiio, streams iq.cs16.v1 to the node's cogbus with every lost sample counted, publishes sdr.status, and serves svc.sdr (tune, rate, gain, bandwidth, band plans, leases)"
publish = false

[[bin]]
name = "cog-sdr-pluto-rx"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
