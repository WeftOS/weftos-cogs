[workspace]

[package]
name = "cog-vision-detect"
version = "0.1.0"
edition = "2021"
description = "Finds what is in camera frames with the node vision model"
publish = false

[[bin]]
name = "cog-vision-detect"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
