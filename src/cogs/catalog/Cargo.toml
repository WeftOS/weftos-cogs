[workspace]

[package]
name = "cog-catalog"
version = "0.1.0"
edition = "2021"
description = "Hardware Catalog app cog: HTTP-serves the Projects -> Modules -> Chips browse page and catalog.json, host-managed like the sensor cogs"

[[bin]]
name = "cog-catalog"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
