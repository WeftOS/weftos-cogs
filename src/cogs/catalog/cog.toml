[cog]
id = "catalog"
name = "Hardware Catalog"
version = "0.1.0"
category = "developer"
description = "Serves the WeftOS hardware-catalog browse page (Projects -> Modules -> Chips) and the catalog JSON over HTTP, so the appliance offers the catalog on the mesh. Embeds crates/cog-market/catalog/catalog.json and a self-contained viewer; no sensor, no store writes."
binary = "cog-catalog-arm"
hardware_requirement = ["v0-appliance"]
# interfaces: src/main.rs: serve (TcpListener only); no device opened
interfaces = ["none"]

[api]
bind_port = 8060
bind_loopback_only = false

[console]
allowed_commands = ["--help"]
max_runtime_secs = 15
output_limit_bytes = 65536
