[workspace]

[package]
name = "cog-tts"
version = "0.1.0"
edition = "2021"
description = "Speaks text on the node as a 16 kHz audio.pcm stream"
publish = false

[[bin]]
name = "cog-tts"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
