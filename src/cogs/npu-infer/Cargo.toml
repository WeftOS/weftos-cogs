[workspace]

[package]
name = "cog-npu-infer"
version = "0.1.0"
edition = "2021"
description = "NPU inference service: owns GenieX on loopback, queues calls by priority, keeps models resident within a memory budget, and answers service calls on the node's cogbus"
publish = false

[[bin]]
name = "cog-npu-infer"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
