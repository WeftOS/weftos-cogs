[workspace]

[package]
name = "cog-mentra-live"
version = "0.1.0"
edition = "2021"
description = "Mentra Live smart-glasses companion bridge: presence + battery + link telemetry over ADB, emitted as a store vector and a fleet heartbeat so the glasses join as a node; fail-honest on no device"

[[bin]]
name = "cog-mentra-live"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
