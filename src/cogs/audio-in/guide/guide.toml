# Sensor guide for audio-in (WeftOS ADR-104 sensor-guide format, schema 1).
# Pages are Markdown files next to this one (guide/<page>.md).

schema = 1
title = "Microphone capture on a Linux board"
sensor = "ALSA capture device (a USB camera's microphone or the board codec)"
cog = "audio-in"
cog_version = "0.1.0"
medical = false
pages = ["start", "device", "setup", "troubleshoot", "api"]

# Checklist step ids the companion app links to a page.
[links]
cog_installed = "setup"
cog_running = "setup"
device = "device"
level = "troubleshoot"
no_source = "troubleshoot"

# Signal flow, left to right.
[[flow]]
name = "Microphone"
detail = "ALSA card, 16 kHz mono"

[[flow]]
name = "arecord"
detail = "s16le, plughw conversion"

[[flow]]
name = "audio-in cog"
detail = "640-byte chunks, level"

[[flow]]
name = "Outputs"
detail = "audio.pcm stream, telemetry, :8063"
