[workspace]

[package]
name = "cog-audio-in"
version = "0.1.0"
edition = "2021"
description = "Owns the ALSA capture device and publishes 16 kHz mono PCM, 20 ms chunks, as a cogbus stream"
publish = false

[[bin]]
name = "cog-audio-in"
path = "src/main.rs"

[dependencies]
cog-sensor-sources = { path = "../../../crates/cog-sensor-sources" }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
